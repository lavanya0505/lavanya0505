name: Refresh Contribution Visuals

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-contribution-visuals
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Build the animated contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-light.svg
            assets/snake-dark.svg?palette=github-dark
      - name: Commit generated visuals
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: refresh contribution visuals"
          file_pattern: "assets/snake-*.svg profile-3d-contrib/*.svg"
